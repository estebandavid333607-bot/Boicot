<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>BOICOT TV+ · Abrir enlace</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0b0d0c;color:#f4f1ea;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(circle at 50% 0%,#182420,#0b0d0c 65%)}
.pag{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:26px 22px 28px;max-width:420px;margin:0 auto;gap:22px}
.marca{font-weight:900;font-size:24px;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.marca i{font-style:normal;background:#22c55e;color:#06140e;border-radius:6px;padding:0 7px;margin:0 3px}

/* ---- "estuche" de videojuego: caratula completa (sin recortar, contain) + lomo con la marca ---- */
#estuche{position:relative;width:min(78vw,320px);filter:drop-shadow(0 20px 46px rgba(0,0,0,.65))}
#caja{position:relative;width:100%;aspect-ratio:2/3;border-radius:10px;background:#101312;
  border:1px solid rgba(255,255,255,.14);overflow:hidden;display:flex;align-items:center;justify-content:center}
#caja.sin-caratula{display:none}
#caratula{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;opacity:0;transition:opacity .5s}
#caratula.ok{opacity:1}
#lomo{position:absolute;top:0;bottom:0;left:-15px;width:15px;border-radius:9px 0 0 9px;
  background:linear-gradient(180deg,#1a3127,#0c1b15);border:1px solid rgba(255,255,255,.14);border-right:0;
  display:flex;align-items:center;justify-content:center}
#lomo span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:900;font-size:11px;
  letter-spacing:.14em;color:#8fcca5;white-space:nowrap}
#brillo{position:absolute;inset:0;border-radius:10px;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 30%)}
#sinimg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
  padding:18px;font-weight:800;color:#8fcca5;background:linear-gradient(145deg,#152821,#0c1511)}
#caja.sin-caratula #sinimg{display:flex}

.info{text-align:center;max-width:460px}
.eti{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#22c55e;margin-bottom:8px}
h1{margin:0 0 6px;font-size:clamp(22px,7vw,30px);line-height:1.15;font-weight:900;word-break:break-word}
p{margin:0;color:#aeb3ac}
.botones{width:100%;max-width:420px}
.btn{display:block;width:100%;margin-top:10px;padding:15px;border-radius:14px;border:0;font:inherit;font-weight:800;font-size:17px;text-decoration:none;text-align:center;cursor:pointer}
.p{background:#22c55e;color:#06140e}
.s{background:rgba(255,255,255,.08);color:#f4f1ea;border:1.5px solid rgba(255,255,255,.3)}
small{display:block;margin-top:14px;color:#aab0a8;text-align:center}
</style></head><body>
<div class="pag">
  <div class="marca">BOICOT<i>TV</i>+</div>

  <div id="estuche">
    <div id="caja">
      <div id="lomo"><span>BOICOT TV+</span></div>
      <img id="caratula" alt="">
      <div id="sinimg">BOICOT<br>TV+</div>
      <div id="brillo"></div>
    </div>
  </div>

  <div class="info">
    <span class="eti" id="eti">Te compartieron algo</span>
    <h1 id="titulo">BOICOT TV+</h1>
    <p id="msg">Toca el botón para abrirlo en la app.</p>
  </div>

  <div class="botones">
    <a id="abrir" class="btn p" href="#">Abrir en BOICOT TV+</a>
    <button id="copiar" class="btn s" type="button">Copiar enlace de la app</button>
    <small id="nota">Necesitas tener BOICOT TV+ instalada en este celular o TV.</small>
  </div>
</div>
<script>
(function () {
  // Debe coincidir con el applicationId de la app (app/build.gradle.kts).
  var PAQUETE = 'com.estebanruiz.boicottvplus208';
  var q = new URLSearchParams(location.search);
  var id = q.get('id') || '', t = q.get('t') || '', n = q.get('n') || '', b = q.get('b') || '';
  var d = document;
  if (!id) {
    d.getElementById('eti').textContent = 'Enlace incompleto';
    d.getElementById('titulo').textContent = 'BOICOT TV+';
    d.getElementById('msg').textContent = 'Este enlace no trae ninguna película o serie.';
    d.getElementById('abrir').style.display = 'none'; d.getElementById('copiar').style.display = 'none';
    d.getElementById('caja').className = 'sin-caratula';
    return;
  }
  if (n) { d.getElementById('titulo').textContent = n; d.title = n + ' · BOICOT TV+'; }
  d.getElementById('eti').textContent = 'Te compartieron en BOICOT TV+';
  d.getElementById('msg').textContent = 'Toca el botón para abrirlo en la app.';
  // Caratula: la imagen de la pelicula, completa y sin recortar (object-fit: contain), como la portada de un estuche.
  var caja = d.getElementById('caja');
  if (/^https:\/\//i.test(b) && b.length < 400) {
    var im = d.getElementById('caratula');
    im.onload = function () { im.className = 'ok'; };
    im.onerror = function () { caja.className = 'sin-caratula'; };
    im.src = b;
  } else {
    caja.className = 'sin-caratula';
  }
  var resto = 'ficha?id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t) + '&n=' + encodeURIComponent(n);
  var directo = 'boicottvplus://' + resto;
  var android = /android/i.test(navigator.userAgent);
  var intento = 'intent://' + resto + '#Intent;scheme=boicottvplus;package=' + PAQUETE + ';end';
  d.getElementById('abrir').href = android ? intento : directo;   // no se abre solo: se abre al tocar el boton
  d.getElementById('copiar').onclick = function () {
    function listo() { d.getElementById('copiar').textContent = '¡Copiado!'; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(directo).then(listo, function () { prompt('Copia este enlace:', directo); });
    else prompt('Copia este enlace:', directo);
  };
  if (!android) d.getElementById('nota').textContent = 'Ábrelo desde el celular o la TV donde tengas BOICOT TV+ instalada.';
})();
</script>
</body></html>
